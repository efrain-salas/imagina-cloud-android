// Imagina Cloud: the "imagina" product flavor of the Nextcloud Android app (see IMAGINA.md).
// Applied from the end of app/build.gradle.kts with a single line, so updating Nextcloud only
// has to keep that line. Groovy on purpose: a script plugin in Groovy can configure the android
// extension without the Android Gradle Plugin classes on its own classpath.

import groovy.json.JsonSlurper

def imaginaParams = new Properties()
rootProject.file("imagina/imagina.properties").withInputStream { imaginaParams.load(it) }
def localOverrides = rootProject.file("imagina/imagina.local.properties")
if (localOverrides.exists()) {
    localOverrides.withInputStream { imaginaParams.load(it) }
}

// Imagina Cloud's Firebase project (imagina-84bd9), from the console's google-services.json, kept out
// of git. Like Nextcloud's Google Play build, its values become resources instead of using the Google
// Services plugin. Without the file the app builds the same, with no notifications.
def firebase = [:]
def googleServices = file("src/imagina/google-services.json")
if (googleServices.exists()) {
    def json = new JsonSlurper().parse(googleServices)
    def client = json.client.find { it.client_info.android_client_info.package_name == imaginaParams.getProperty("IMAGINA_APPLICATION_ID") }
    if (client != null) {
        firebase = [
            google_app_id       : client.client_info.mobilesdk_app_id,
            google_api_key      : client.api_key[0].current_key,
            gcm_defaultSenderId : json.project_info.project_number,
            project_id          : json.project_info.project_id,
            google_storage_bucket: json.project_info.storage_bucket ?: "",
        ]
    }
}

android {
    // Needed for the resValue lines below (off by default since AGP 9); no effect on other flavors
    buildFeatures {
        resValues true
    }

    productFlavors {
        imagina {
            dimension "default"
            applicationId imaginaParams.getProperty("IMAGINA_APPLICATION_ID")
            versionNameSuffix imaginaParams.getProperty("IMAGINA_VERSION_NAME_SUFFIX", "")

            // Values that change between environments; the rest of the branding is in
            // app/src/imagina/res/values/setup.xml.
            resValue "string", "webview_login_url", imaginaParams.getProperty("IMAGINA_CLOUD_URL") + "/index.php/login/v2"

            // Notifications through Imagina's push server (C7.10), only with Imagina's Firebase project
            resValue "string", "push_server_url", firebase.isEmpty() ? "" : imaginaParams.getProperty("IMAGINA_PUSH_SERVER_URL", "")
            firebase.each { name, value -> resValue "string", name, value.toString() }

            // «Entrar con Imagina» (app/src/main/java/build/imagina/cloud/ImaginaSignIn.kt)
            resValue "string", "imagina_auth_host", imaginaParams.getProperty("IMAGINA_AUTH_HOST", "")
            resValue "string", "imagina_oauth_client_id", imaginaParams.getProperty("IMAGINA_OAUTH_CLIENT_ID", "")
        }
    }

    sourceSets {
        // The variant classes of Nextcloud's Google Play build: notifications by Firebase Cloud Messaging.
        // Its manifest entries are in app/src/imagina/AndroidManifest.xml.
        imagina {
            java.srcDirs += "src/gplay/java"
            kotlin.srcDirs += "src/gplay/java"
        }
    }
}

dependencies {
    imaginaImplementation project.extensions.getByType(VersionCatalogsExtension).named("libs").findBundle("gplay").get()
}
