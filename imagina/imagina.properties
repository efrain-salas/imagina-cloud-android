# Parameters of the Imagina Cloud build (see IMAGINA.md). No secrets here: this file is committed.

# Android application id (also the base of the account type and content authorities in setup.xml)
IMAGINA_APPLICATION_ID=build.imagina.cloud

# The Nextcloud server the app is locked to. Login uses Nextcloud's Login Flow v2 on it, which hands
# over to Imagina's sign-in (mobile + SMS code) through user_oidc.
IMAGINA_CLOUD_URL=https://cloud-test.imagina.build

# Imagina's push proxy (docs/PLAN_CLOUD.md, C7.10). Empty: no push notifications yet.
IMAGINA_PUSH_SERVER_URL=

# Version shown to people (versionCode follows Nextcloud's)
IMAGINA_VERSION_NAME_SUFFIX=-imagina

# «Entrar con Imagina»: Imagina's identity server and the public OAuth client of this app
# (php artisan passport:client --public, redirect <IMAGINA_APPLICATION_ID>://oauth2redirect).
# Empty IMAGINA_AUTH_HOST: the app falls back to Nextcloud's own login (Login Flow v2).
IMAGINA_AUTH_HOST=auth.imagina.build
IMAGINA_OAUTH_CLIENT_ID=01a11cc3-b700-733c-90c7-e4d0f50f38d8
