name: "Informar de un fallo"
description: "Cuéntanos qué falla en Imagina Cloud para Android"
labels: ["bug"]
body:
    -   type: markdown
        attributes:
            value: |
                Gracias por avisarnos. No escribas aquí contraseñas, códigos SMS ni datos personales, y revisa las capturas antes de subirlas.
    -   type: input
        id: app-version
        attributes:
            label: Versión de la app
            description: En Ajustes, en el apartado «Acerca de».
            placeholder: "35.0.1-imagina"
        validations:
            required: true
    -   type: input
        id: android-version
        attributes:
            label: Versión de Android y modelo del móvil
            placeholder: "Android 15, Pixel 8"
        validations:
            required: true
    -   type: textarea
        id: repro-steps
        attributes:
            label: Pasos para reproducirlo
            placeholder: |
                1.
                2.
                3.
        validations:
            required: true
    -   type: textarea
        id: what-happened
        attributes:
            label: Qué pasó y qué esperabas que pasara
            description: Si puedes, añade una captura de pantalla o el texto de la pantalla de fallo.
        validations:
            required: true
